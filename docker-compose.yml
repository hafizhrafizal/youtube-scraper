services:
  app:
    build: .
    container_name: youtube-scraper
    restart: unless-stopped
    env_file: .env
    # Only reachable via host nginx (apps.hafizhrafizal.com/yt-scraper/)
    ports:
      - "127.0.0.1:5001:5000"
    # Persists per-IP usage of the shared API key across redeploys
    volumes:
      - ./data:/app/data
